name: Deploy PathFinder frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pathfinder/frontend/UI/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare preview with login as homepage
        run: |
          mkdir -p _pathfinder_site
          cp -R pathfinder/frontend/UI/. _pathfinder_site/
          cp _pathfinder_site/index.html _pathfinder_site/dashboard.html
          cp _pathfinder_site/login.html _pathfinder_site/index.html

      - name: Upload static PathFinder UI
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pathfinder_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
